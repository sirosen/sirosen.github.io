---
layout: default
---

<h1 id="posts">Posts</h1>

<p>Below is a list of posts that I have made, sorted (reverse) chronologically.</p>

<ul>
  {% for post in site.posts %}
    <li>
      <a href="{{ post.url }}">{{ post.date | split: " " | slice: 0 }} -- {{ post.title }}</a>
    </li>
  {% endfor %}
</ul>
